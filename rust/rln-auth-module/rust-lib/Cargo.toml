[package]
name = "rln_auth_module"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "0e43809d5c2fe41b58380d1d9a2decb0fdb4d296", package = "rln_auth_vector" }
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "0e43809d5c2fe41b58380d1d9a2decb0fdb4d296", package = "rln_auth_vectors", default-features = false, features = ["verify"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
hex = "0.4"
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "0e43809d5c2fe41b58380d1d9a2decb0fdb4d296", package = "rln_auth_vectors", default-features = false, features = ["verify", "sign"] }
