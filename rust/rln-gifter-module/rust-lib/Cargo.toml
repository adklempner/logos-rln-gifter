[package]
name = "rln_gifter_module"
version = "0.3.1"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib"]

[profile.release]
# Abort (not unwind) across the FFI boundary — a Rust panic must never unwind
# into the C++ host.
panic = "abort"

[dependencies]
serde_json = "1"
hex = "0.4"
base64 = "0.22"
# No auth crypto here: vector verification/production lives in plugin modules
# speaking the rln_auth_vector contract.
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.2.0", package = "rln_auth_vector" }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
