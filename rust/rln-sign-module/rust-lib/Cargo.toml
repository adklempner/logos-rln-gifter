[package]
name = "rln_sign_module"
version = "0.2.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.0", package = "rln_auth_vector" }
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.0", package = "rln_auth_vectors", default-features = false, features = ["sign"] }
zksign_light = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.0", package = "zksign_light", default-features = false, features = ["client"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
base58 = "0.2"
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.0", package = "rln_auth_vectors", default-features = false, features = ["sign", "verify"] }
