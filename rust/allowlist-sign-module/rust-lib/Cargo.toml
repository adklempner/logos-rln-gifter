[package]
name = "allowlist_sign_module"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base58 = "0.2"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "79b90eef9423ce6a9000182a2d343be7eacd8d6b", package = "rln_auth_vector" }
zksign_light = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "1eb479a30b5df13c1ce53ca68693bbd890ffa645", package = "zksign_light", default-features = false, features = ["client"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
zksign_light = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "1eb479a30b5df13c1ce53ca68693bbd890ffa645", package = "zksign_light", default-features = false, features = ["client", "verify"] }
