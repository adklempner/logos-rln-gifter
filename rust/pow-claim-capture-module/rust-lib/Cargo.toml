[package]
name = "pow_claim_capture_module"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["pow-claim-core"]

[lib]
crate-type = ["staticlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", rev = "79b90eef9423ce6a9000182a2d343be7eacd8d6b", package = "rln_auth_vector" }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
pow-claim-core = { path = "pow-claim-core" }
