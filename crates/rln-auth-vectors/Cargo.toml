[package]
name = "rln_auth_vectors"
version = "0.1.0"
edition = "2021"
description = "The RLN gifter's auth-vector pieces: the eth, lez, logos and keycard schemes and the allowlist, attestation and pow-claim authorisers, each with its produce half"
license = "MIT OR Apache-2.0"

[features]
default = ["verify", "sign"]
# The verify halves: schemes and authorisers.
verify = ["zksign_light/verify", "pow-claim/verify"]
# The produce halves: signers and claimants.
sign = ["dep:rand_core", "zksign_light/client", "pow-claim/produce"]
# The keycard signer over PC/SC (the capture module only).
keycard-pcsc = ["sign", "dep:keycard_client"]

[dependencies]
rln_auth_vector = { path = "../rln-auth-vector" }
zksign_light = { path = "../zksign-light", default-features = false }
keycard_attest = { path = "../keycard-attest" }
keycard_client = { path = "../keycard-client", optional = true }
pow-claim = { path = "../pow-claim", default-features = false, features = ["strict-ownership"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base58 = "0.2"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
