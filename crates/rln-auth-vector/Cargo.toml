[package]
name = "rln_auth_vector"
version = "0.2.0"
edition = "2021"
description = "Contract kit for RLN gifter auth vectors: the produce/verify JSON shapes, the signed binding, and the scheme × authoriser composition shared by the gifter and every vector module"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
